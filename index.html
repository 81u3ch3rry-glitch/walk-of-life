<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walk Of Life Music Player</title>
	<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; }
  body { background: #f8f5cf; color: #fffdd0; }
  .player-top {
    position: relative; min-height: 435px; overflow: hidden;
    background:
      radial-gradient(ellipse at 76% 42%, rgba(125,105,67,.48), transparent 36%),
      radial-gradient(ellipse at 30% 55%, rgba(91,54,41,.38), transparent 38%),
      linear-gradient(110deg, #080909 0%, #17110e 52%, #070808 100%);
    padding: 55px 4% 36px;
  }
  .player-top::before { content:""; position:absolute; inset:0; background:rgba(0,0,0,.22); pointer-events:none; }
  .close-screen { position:absolute; top:24px; right:24px; z-index:2; padding:8px 13px; border:1px solid #005696; border-radius:22px; color:#fffdd0; background:rgba(51,51,102,.72); font-size:14px; }
  .top-grid { position:relative; z-index:1; display:grid; grid-template-columns: minmax(190px, 1fr) minmax(300px, 2.1fr) minmax(210px, 1fr); align-items:start; gap:28px; max-width:1400px; margin:0 auto; }
  .album-wrap { padding-top:0; display:flex; justify-content:flex-start; }
  .album-cover { width:min(100%,254px); aspect-ratio:1; border:2px solid #005696; background:linear-gradient(145deg,#111,#29251f); box-shadow:0 12px 40px rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .cover-placeholder { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:12px; color:#e9c341; background:radial-gradient(ellipse at 50% 35%,#5c5141,#0a0c10 64%); }
  .cover-placeholder .band { font-weight:900; font-style:italic; font-size:clamp(22px,3vw,38px); letter-spacing:-2px; text-shadow:2px 3px #a21e13; }
  .cover-placeholder .car { font-size:62px; line-height:1.2; filter:drop-shadow(0 0 8px #b92716); }
  .cover-placeholder small { margin-top:10px; color:#a9a6a0; font-size:10px; letter-spacing:3px; }
  .song-info { text-align:center; padding-top:2px; min-width:0; }
  .song-title { margin:0 auto 20px; padding-bottom:9px; max-width:520px; border-bottom:1px solid rgba(255,253,208,.65); color:#fffdd0; font-size:clamp(27px,3.1vw,43px); line-height:1.08; font-weight:800; }
  .song-artist { font-size:24px; font-weight:700; margin:0 0 8px; }
  .song-album { font-size:16px; color:#c9c5a8; font-style:italic; margin-bottom:22px; }
  .time-row { display:flex; justify-content:space-between; max-width:680px; margin:0 auto 6px; font-size:14px; font-weight:700; }
  .progress-track { max-width:680px; height:8px; margin:0 auto 23px; background:#173a5a; border-radius:8px; overflow:hidden; }
  .progress-fill { width:9%; height:100%; background:#1764a0; border-radius:8px; }
  .controls { display:flex; align-items:center; justify-content:center; gap:20px; }
  .control { width:64px; height:58px; display:flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid #005696; background:rgba(51,51,102,.56); color:#fffdd0; font-size:25px; }
  .control.main { width:70px; height:60px; font-size:25px; }
  .daily-card { margin-top:70px; padding:12px 15px 13px; border:1px solid rgba(255,253,208,.28); border-radius:16px; background:rgba(51,51,102,.82); text-align:center; box-shadow:0 8px 28px rgba(0,0,0,.18); }
  .eyebrow { font-size:10px; letter-spacing:2px; font-weight:800; margin-bottom:6px; }
  .daily-card h2 { margin:0 0 7px; font-size:20px; line-height:1.25; }
  .daily-card p { margin:0; font-size:11px; line-height:1.4; opacity:.92; }
  .player-bottom { min-height:265px; position:relative; overflow:hidden; background:#f8f5cf; color:#30345d; padding:24px 4% 0; }
  .bottom-grid { max-width:1400px; min-height:243px; margin:0 auto; display:grid; grid-template-columns: 1.5fr 230px 180px; gap:35px; align-items:end; }
  .equalizer { height:150px; display:flex; align-items:flex-end; justify-content:center; gap:7px; padding:0 12px 0; margin-bottom:0; align-self:end; }
  .equalizer { align-items:flex-end; }
  .bar { flex:0 0 7px; height:20%; transition:height 180ms ease-out; width:7px; border-radius:3px 3px 0 0; background:#075b9c; box-shadow:0 0 7px rgba(0,86,150,.35); }
  .flavor-card { width:100%; min-height:260px; padding:13px 12px 14px; display:flex; flex-direction:column; align-items:center; text-align:center; border-radius:19px; background:linear-gradient(160deg,#333366,#005696); color:white; box-shadow:0 8px 28px rgba(51,51,102,.22); }
  .flavor-card .eyebrow { margin-bottom:8px; }

  // Weekly events and short descriptions, based on the Walk Of Life book.
  // JavaScript day numbers: Sunday = 0, Monday = 1, ... Saturday = 6.
  const dailyEvents = [
    { title: "Sunday — Ice Cream Night", description: "Enjoy frozen custard, music, and a great night sky to make happy memories." },
    { title: "Monday — Milkshake Monday", description: "Celebrate Monday with delicious milkshakes and the fun that starts a new week." },
    { title: "Tuesday — Create-A-Custard Day", description: "Customers use their imagination to create their own custard ideas." },
    { title: "Wednesday — Classic Rock Trivia Night", description: "Test your classic rock knowledge at free trivia night, starting at 7 PM." },
    { title: "Thursday — Sundae Day", description: "Enjoy special sundaes, try tasty toppings, and take on the giant sundae challenge." },
    { title: "Friday — Funday", description: "Come celebrate Friday with discounts, crowds, and fun for everyone." },
    { title: "Saturday — Food Truck Day", description: "Visit the nearby park for food trucks, music, and family fun." }
  ];
  const todayEvent = dailyEvents[new Date().getDay()];
  document.getElementById("dailyTitle").textContent = todayEvent.title;
  document.getElementById("dailyDescription").textContent = todayEvent.description;
	const dailyCard = document.getElementById("dailyCard");

function openArcadeFromBanner() {
  window.location.href = "arcade.html";
}

dailyCard.addEventListener("click", openArcadeFromBanner);

dailyCard.addEventListener("keydown", function(event) {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    openArcadeFromBanner();
  }
});

  const flavors = [
    "Sweet Emotion", "Black Dog", "Dream On", "Born in the USA", "Go Your Own Way",
    "Barracuda", "Runnin’ with the Devil", "Carry On Wayward Son", "Hotel California", "More Than a Feeling",
    "Magic Man", "Smoke on the Water", "American Pie", "Free Bird", "Rock and Roll All Nite",
    "Whole Lotta Love", "Vanilla", "Chocolate", "Strawberry", "Mint Chocolate Chip"
  ];
  const photo = document.getElementById("flavorPhoto");
  const name = document.getElementById("flavorName");
  const desc = document.getElementById("flavorDesc");
  let previous = -1;
  function chooseFlavor() {
    let index;
    do { index = Math.floor(Math.random() * flavors.length); } while (flavors.length > 1 && index === previous);
    previous = index;
    const col = index % 5;
    const row = Math.floor(index / 5);
    photo.style.backgroundPosition = (col * 25) + "% " + (row * (100 / 3)) + "%";
    photo.setAttribute("aria-label", flavors[index] + " ice cream");
    name.textContent = flavors[index];
    desc.textContent = "A little something sweet.";
  }
  chooseFlavor();
  window.setInterval(chooseFlavor, 60000);
})();
</script>

<script>
(() => {
  let secretOpen = false;
  let secretBox;

  function toggleSecretFlavor() {
    if (secretOpen) {
      secretBox.remove();
      secretOpen = false;
      return;
    }

    secretOpen = true;
    secretBox = document.createElement("div");

    secretBox.style.cssText = `
      position:fixed; inset:0; z-index:999999;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:linear-gradient(135deg,#ff69b4,#9b5de5,#00bbf9);
      color:white; font-family:Arial,sans-serif;
      text-align:center;
    `;

    secretBox.innerHTML = `
      <div style="font-size:80px">🍦🎸🍒</div>
      <h1>SECRET FLAVOR MODE!</h1>
      <p style="font-size:22px">
        You've discovered the sweet side of music!
      </p>
      <div style="font-size:32px">🍬 🍓 🍫 🌈 🍭 🍦 🍒</div>
      <button id="closeFlavor" style="
        margin-top:28px;padding:14px 24px;border:0;
        border-radius:30px;font-size:18px;
        font-weight:bold;cursor:pointer;color:#772b92;
      ">Back to the music ✨</button>
    `;

    document.body.appendChild(secretBox);
    secretBox.querySelector("#closeFlavor").onclick =
      toggleSecretFlavor;
  }

  document.addEventListener("keydown", event => {
    if (
      event.altKey &&
	event.shiftKey &&
	event.key.toLowerCase() === "k"
    ) {
      event.preventDefault();
      toggleSecretFlavor();
    }

    if (event.key === "Escape" && secretOpen) {
      toggleSecretFlavor();
    }
  });
})();
	/* Ice Cream Mode switch */
.mode-switch {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 12px;
  border: 1px solid #e9c341;
  border-radius: 24px;
  background: rgba(20, 20, 35, 0.94);
  color: #fffdd0;
  font-size: 13px;
  font-weight: bold;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
}

.mode-switch input {
  width: 18px;
  height: 18px;
  accent-color: #e9c341;
  cursor: pointer;
}
</script>
</body>
</html>
