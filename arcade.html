<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walk Of Life Arcade</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f4faff;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
<!-- WALK OF LIFE ARCADE -->
<style>
  #wol-arcade {
    margin: 30px auto;
    padding: 24px;
    max-width: 700px;
    box-sizing: border-box;
    border-radius: 18px;
    background: linear-gradient(135deg, #005696, #333366);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  #wol-arcade button {
    margin: 6px;
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: white;
    color: #333366;
    font-weight: bold;
    cursor: pointer;
  }

  #wol-arcade button:hover {
    transform: scale(1.04);
  }

  #wol-arcade canvas {
    display: block;
    width: 100%;
    max-width: 440px;
    height: auto;
    margin: 16px auto;
    border: 3px solid white;
    border-radius: 12px;
    background: #f4faff;
    touch-action: none;
  }

  #wol-arcade .wol-game {
    display: none;
  }

  #wol-arcade .wol-game.active {
    display: block;
  }
</style>

<section id="wol-arcade">
	<button onclick="window.location.href='index.html'">
  🎵 Back to Music Player
</button>
  <h2>🍦 Walk Of Life Arcade 🎮</h2>
	<div id="ice-cream-explosion" style="
  margin: 20px auto;
  padding: 22px;
  max-width: 650px;
  background: linear-gradient(135deg, #ff477e, #ff9f43, #8e6cff);
  border-radius: 18px;
  color: white;
  text-align: center;
  font-family: Arial, sans-serif;
  box-sizing: border-box;
">
  <h3 style="font-size: 28px; margin: 0 0 10px;">
    💥 Ice Cream Explosion! 🍦
  </h3>

  <p>Warning: dangerously high levels of deliciousness.</p>

  <button id="ice-cream-explode-button" style="
    padding: 14px 24px;
    border: 3px solid white;
    border-radius: 14px;
    background: #005696;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
  ">
    💣 UNLEASH THE SCOOPS!
  </button>
		<button id="ice-cream-mega-button" style="
  margin: 10px;
  padding: 16px 26px;
  border: 3px solid white;
  border-radius: 14px;
  background: #333366;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 18px #ffffff88;
">
  🌋 MEGA EXPLOSION
</button>

  <div id="ice-cream-explosion-status" aria-live="polite">
    Ready for maximum deliciousness.
  </div>
</div>
  <p>Choose your game!</p>

  <button onclick="wolShowGame('pinball')">🍒 Sundae Pinball</button>
  <button onclick="wolShowGame('snake')">🐍 Ice Cream Snake</button>

  <div id="wol-pinball" class="wol-game">
    <h3>🍒 Sundae Pinball</h3>
    <p>Use the left and right arrow keys to flip!</p>
    <canvas id="wol-pin-canvas" width="440" height="440"></canvas>
    <button onclick="wolStartPinball()">Start / Restart</button>
    <p id="wol-pin-score">Score: 0</p>
  </div>

  <div id="wol-snake" class="wol-game">
    <h3>🐍 Ice Cream Snake</h3>
    <p>Collect scoops with the arrow keys!</p>
    <canvas id="wol-snake-canvas" width="400" height="400"></canvas>
    <button onclick="wolStartSnake()">Start / Restart</button>
    <p id="wol-snake-score">Scoops: 0</p>
  </div>
</section>
	
<script>
(function () {
  const $ = id => document.getElementById(id);
  const pin = $("wol-pin-canvas");
  const p = pin.getContext("2d");
  const snakeCanvas = $("wol-snake-canvas");
  const s = snakeCanvas.getContext("2d");

  let current = "pinball";
  let pinTimer = null;
  let ball, pinScore = 0, leftFlip = false, rightFlip = false;
	let bumperHits = 0;
	let sweetMode = false;
	let sweetTimer = null;
	let speedMultiplier = 1;
  let snakeTimer = null, snake, direction, food, snakeScore = 0;

  window.wolShowGame = function (name) {
    current = name;
    document.querySelectorAll("#wol-arcade .wol-game")
      .forEach(el => el.classList.remove("active"));
    $("wol-" + name).classList.add("active");
    if (name === "pinball") drawPinball();
    if (name === "snake") drawSnake();
  };

  function resetPinball() {
  clearInterval(pinTimer);
  pinTimer = null;

  clearTimeout(sweetTimer);
  sweetTimer = null;
  sweetMode = false;
speedMultiplier = 1;
bumperHits = 0;

  ball = { x: 220, y: 320, vx: 0, vy: 0 };
  pinScore = 0;

  $("wol-pin-score").textContent = "Score: 0";
  drawPinball();
}

  window.wolStartPinball = function () {
    resetPinball();
    ball.x = 190 + Math.random() * 60;
    ball.y = 260;
    ball.vx = (Math.random() - .5) * 6;
    ball.vy = 3 + Math.random() * 2;

    pinTimer = setInterval(() => {
      const frameSpeed = speedMultiplier;
ball.x += ball.vx * frameSpeed;
ball.y += ball.vy * frameSpeed;
ball.vy += .12;

      if (ball.x < 12 || ball.x > 428) ball.vx *= -1;
      if (ball.y < 12) ball.vy = Math.abs(ball.vy);

      const bumpers = [[100,100],[330,120],[220,200],[120,275],[330,280]];
      bumpers.forEach(([x,y]) => {
        const dx = ball.x-x, dy = ball.y-y;
        const distance = Math.hypot(dx,dy);
        if (distance < 35) {
          const angle = Math.atan2(dy,dx);
          const speed = 4 + Math.random()*4;
          ball.vx = Math.cos(angle)*speed + (Math.random()-.5)*2;
          ball.vy = Math.sin(angle)*speed;
          ball.x = x + Math.cos(angle)*36;
          ball.y = y + Math.sin(angle)*36;
          pinScore++;
			bumperHits++;

if (bumperHits >= 5 && !sweetMode) {
  sweetMode = true;
  speedMultiplier = 10;

  clearTimeout(sweetTimer);

  sweetTimer = setTimeout(() => {
    sweetMode = false;
    speedMultiplier = 1;
    sweetTimer = null;
    drawPinball();
  }, 10000);
}
          $("wol-pin-score").textContent = "Score: " + pinScore;
        }
      });


if (ball.y > 350 && ball.y < 410 && ball.vy > 0) {
  const paddleSize = sweetMode ? 45 : 0;

  // Left flipper
  if (ball.x > 75 - paddleSize && ball.x < 215 + paddleSize) {
    ball.vy = leftFlip ? -11 - Math.random() * 4 : -2.5;
    ball.vx = leftFlip
      ? (Math.random() - 0.5) * 7
      : (ball.x < 145 ? -1.5 : 1.5);
    ball.y = 349;
    if (leftFlip) pinScore += 2;
  }

  // Right flipper
  else if (ball.x > 225 - paddleSize && ball.x < 365 + paddleSize) {
    ball.vy = rightFlip ? -11 - Math.random() * 4 : -2.5;
    ball.vx = rightFlip
      ? (Math.random() - 0.5) * 7
      : (ball.x < 295 ? -1.5 : 1.5);
    ball.y = 349;
    if (rightFlip) pinScore += 2;
  }
}

  $("wol-pin-score").textContent = "Score: " + pinScore;

if (ball.y > 440 && !sweetMode) {
  clearInterval(pinTimer);
  pinTimer = null;
}
drawPinball();
    }, 25);
  };

  function drawPinball() {
    p.clearRect(0,0,440,440);
    p.fillStyle = "#eaf6ff";
    p.fillRect(0,0,440,440);
	  if (sweetMode) {
  p.fillStyle = "#ff477e";
  p.fillRect(65, 40, 310, 38);
  p.fillStyle = "white";
  p.font = "bold 23px Arial";
  p.textAlign = "center";
  p.fillText("SWEET MODE!", 220, 67);
  p.textAlign = "left";
}

    [[100,100],[330,120],[220,200],[120,275],[330,280]].forEach(([x,y]) => {
      p.beginPath();
      p.arc(x,y,25,0,Math.PI*2);
      p.fillStyle="#005696";
      p.fill();
      p.font="23px Arial";
      p.fillStyle="white";
      p.fillText("🍦",x-13,y+8);
    });

    p.save();
    p.translate(145,386);
    p.rotate(leftFlip ? -.45 : .15);
    p.fillStyle="#ff477e";
    p.fillRect(-60,-9,120,18);
    p.restore();

    p.save();
    p.translate(295,386);
    p.rotate(rightFlip ? .45 : -.15);
    p.fillStyle="#ff477e";
	p.fillRect(-60,-9,120,18);
    p.restore();

    p.beginPath();
    p.arc(ball.x,ball.y,12,0,Math.PI*2);
    p.fillStyle="#ff477e";
    p.fill();
    p.font="20px Arial";
    p.fillStyle="#333366";
    p.fillText("🍒",10,25);
  }

  document.addEventListener("keydown", e => {
    if (!pin.classList) return;
    if (e.key === "ArrowLeft") leftFlip = true;
    if (e.key === "ArrowRight") rightFlip = true;
    if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)
        && current === "pinball") e.preventDefault();
    if (current === "snake") {
      if (e.key === "ArrowUp") turn(0,-1);
      if (e.key === "ArrowDown") turn(0,1);
      if (e.key === "ArrowLeft") turn(-1,0);
      if (e.key === "ArrowRight") turn(1,0);
    }
    drawPinball();
  });

  document.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft") leftFlip = false;
    if (e.key === "ArrowRight") rightFlip = false;
    drawPinball();
  });

  pin.addEventListener("click", () => {
    if (!pinTimer) window.wolStartPinball();
  });

  function resetSnake() {
    clearInterval(snakeTimer);
    snakeTimer = null;
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    direction = {x:1,y:0};
    snakeScore = 0;
    placeFood();
    $("wol-snake-score").textContent = "Scoops: 0";
    drawSnake();
  }

  function placeFood() {
    food = {x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};
  }

  function turn(x,y) {
    if (x !== -direction.x || y !== -direction.y) direction={x,y};
  }

  function drawSnake() {
    s.fillStyle="#f4faff";
    s.fillRect(0,0,400,400);
    snake.forEach((part,i) => {
      s.fillStyle = i===0 ? "#ff477e" : "#005696";
      s.fillRect(part.x*20+2,part.y*20+2,16,16);
    });
    s.font="18px Arial";
    s.fillText("🍦",food.x*20,food.y*20+18);
  }

  window.wolStartSnake = function () {
    resetSnake();
    snakeTimer = setInterval(() => {
      const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
      if (head.x<0||head.y<0||head.x>=20||head.y>=20||
          snake.some(part=>part.x===head.x&&part.y===head.y)) {
        clearInterval(snakeTimer);
        snakeTimer=null;
        return;
      }
      snake.unshift(head);
      if (head.x===food.x&&head.y===food.y) {
        snakeScore++;
        $("wol-snake-score").textContent="Scoops: "+snakeScore;
        placeFood();
      } else snake.pop();
      drawSnake();
    },150);
  };

    resetPinball();
  resetSnake();
  window.wolShowGame("pinball");
})();
	// 🍦 ICE CREAM EXPLOSION 💥
(function () {
  const button = document.getElementById("ice-cream-explode-button");
	const megaButton = document.getElementById("ice-cream-mega-button");
  const status = document.getElementById("ice-cream-explosion-status");

  if (!button || !status) return;

  const treats = ["🍦", "🍨", "🍒", "🍬", "🍭", "🍫", "🌈", "✨", "🍓", "🩷"];
  let exploding = false;

  function launchExplosion(treatCount) {
    if (exploding) return;
    exploding = true;
    button.disabled = true;
megaButton.disabled = true;
    status.textContent = "💥 ICE CREAM OVERLOAD!!! 💥";

    const burst = document.createElement("div");
    burst.style.cssText = `
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 99999;
    `;
    document.body.appendChild(burst);

    for (let i = 0; i < treatCount; i++) {
      const piece = document.createElement("span");
      piece.textContent = treats[Math.floor(Math.random() * treats.length)];

      const angle = Math.random() * Math.PI * 2;
      const distance = 150 + Math.random() * Math.max(innerWidth, innerHeight) * 0.7;
      const spin = Math.random() * 1000 - 500;

      piece.style.cssText = `
        position: absolute;
        left: 50%;
        top: 50%;
        font-size: ${18 + Math.random() * 30}px;
        transform: translate(-50%, -50%);
        animation: iceCreamBlast ${1.2 + Math.random() * 1.8}s ease-out forwards;
        --x: ${Math.cos(angle) * distance}px;
        --y: ${Math.sin(angle) * distance}px;
        --spin: ${spin}deg;
      `;

      burst.appendChild(piece);
    }

    setTimeout(() => {
      burst.remove();
      status.textContent = "Explosion complete. Deliciousness restored. 🍦";
      button.disabled = false;
megaButton.disabled = false;
      exploding = false;
    }, 3200);
  }

  const style = document.createElement("style");
  style.textContent = `
    @keyframes iceCreamBlast {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
      }
      15% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(
          calc(-50% + var(--x)),
          calc(-50% + var(--y))
        ) scale(1.5) rotate(var(--spin));
      }
    }
  `;
    document.head.appendChild(style);

  button.addEventListener("click", function () {
    launchExplosion(100);
  });

  megaButton.addEventListener("click", function () {
    launchExplosion(1000);
  });
})();
</script>
	
<div style="text-align: center; margin: 30px auto; padding: 0 12px;">
  <button
    onclick="window.location.href='flavor-roulette.html'"
    style="
      padding: 16px 28px;
      border: 3px solid white;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff477e, #ff9f43, #8e6cff);
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 14px #33336630;
    ">
    🎡🍦 PLAY FLAVOR ROULETTE! 🍦🎡
  </button>
</div>
<!-- END WALK OF LIFE ARCADE -->
</body>
</html>
